# conf-motor — UN proceso, UNA GPU, todas las salas.
#
# Lo que NO se escribe acá, a propósito: ni runtimeClassName, ni
# nvidia.com/gpu, ni variables NVIDIA_*. La GPU la pone la plataforma al
# admitir el pod (contrato: `gpu: true`); escribirlo lo rechaza.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conf-motor
  labels: {app: conf-motor}
spec:
  replicas: 1
  # Recreate y no rolling update: hay UNA tarjeta. Un segundo pod esperaría
  # para siempre la GPU que tiene el primero. Cada despliegue del motor
  # corta lo que tarde en cargar los pesos; el hub lo muestra "degradado".
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: conf-motor}
  template:
    metadata:
      labels: {app: conf-motor}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        # UN contenedor: cada contenedor pediría su propia tarjeta.
        - name: app
          image: registry.registry-system.svc.cluster.local:5000/conf-motor
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          env:
            - {name: BACKEND, value: "gpu"}
            - {name: MAX_SALAS, value: "28"}
            - {name: REDIS_ADDR, value: "bus:6379"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: bus-credenciales, key: password}}
            # Pesos: el volumen que siembra la plataforma (lo que midió
            # experimental). Whisper sale de la caché de Hugging Face, sin
            # red; los traductores, de sus carpetas CTranslate2.
            - {name: MODELOS, value: "/models"}
            - {name: HF_HUB_CACHE, value: "/models/hf/hub"}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: HF_HOME, value: "/tmp/hf"}
            # Gemini (respaldo automático si la GPU falla, y backend por sala).
            - {name: VERTEX_PROYECTO, value: "aegis-505709"}
            - {name: VERTEX_REGION, value: "us-central1"}
            - {name: GEMINI_MODELO, value: "gemini-2.5-flash-lite"}
            - {name: GOOGLE_APPLICATION_CREDENTIALS, value: "/secrets/vertex/vertex.json"}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: pesos, mountPath: /models, readOnly: true}
            - {name: vertex, mountPath: /secrets/vertex, readOnly: true}
          # Tamaño `inferencia` (contrato): 28 salas midieron ~0,3 núcleos
          # por sala de CPU de apoyo (el espectrograma de Whisper).
          resources:
            requests: {cpu: "4", memory: 6Gi}
            limits: {cpu: "8", memory: 10Gi}
          # Un worker no escucha: sin Service, sin puerto, sin sonda HTTP.
          # Su vida se ve en el latido que deja en redis cada 5 s
          # (conf:motor), que leen el panel y /api/healthz del hub.
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 2Gi}
        - name: pesos
          persistentVolumeClaim: {claimName: motor-pesos, readOnly: true}
        - name: vertex
          secret:
            secretName: motor-vertex
            items: [{key: vertex.json, path: vertex.json}]
